# Kafka 3.x with ZooKeeper (assignment requires ZK)
process.roles=
# leave KRaft empty; classic mode via Zookeeper
zookeeper.connect=zk-0.zk.hadoop.svc.cluster.local:2181,zk-1.zk.hadoop.svc.cluster.local:2181,zk-2.zk.hadoop.svc.cluster.local:2181
zookeeper.connection.timeout.ms=18000

# overridden per broker in StatefulSet
broker.id=0
listeners=PLAINTEXT://:9092
advertised.listeners=PLAINTEXT://kafka-0.kafka.hadoop.svc.cluster.local:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

log.dirs=/var/lib/kafka/data
num.partitions=6
default.replication.factor=3
min.insync.replicas=2
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

group.initial.rebalance.delay.ms=0
auto.create.topics.enable=false
