apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: hadoop
data:
  server.properties.tpl: |
    broker.id=${BROKER_ID}
    listeners=PLAINTEXT://0.0.0.0:9092
    advertised.listeners=PLAINTEXT://${POD_NAME}.kafka-hs.hadoop.svc.cluster.local:9092
    listener.security.protocol.map=PLAINTEXT:PLAINTEXT
    inter.broker.listener.name=PLAINTEXT
    num.network.threads=3
    num.io.threads=8
    socket.send.buffer.bytes=102400
    socket.receive.buffer.bytes=102400
    socket.request.max.bytes=104857600
    log.dirs=/var/lib/kafka/data
    num.partitions=6
    default.replication.factor=3
    min.insync.replicas=2
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    log.retention.hours=168
    log.segment.bytes=1073741824
    zookeeper.connect=zk-0.zk-hs.hadoop.svc.cluster.local:2181,zk-1.zk-hs.hadoop.svc.cluster.local:2181,zk-2.zk-hs.hadoop.svc.cluster.local:2181
    zookeeper.connection.timeout.ms=60000
    group.initial.rebalance.delay.ms=0
    auto.create.topics.enable=false
