apiVersion: v1
kind: Service
metadata:
  name: namenode
  namespace: hadoop
spec:
  selector:
    app: namenode
  ports:
    - name: rpc
      port: 9000
      targetPort: 9000
    - name: http
      port: 9870
      targetPort: 9870
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: namenode
  namespace: hadoop
spec:
  serviceName: namenode
  replicas: 1
  selector:
    matchLabels:
      app: namenode
  template:
    metadata:
      labels:
        app: namenode
    spec:
      containers:
        - name: namenode
          image: apache/hadoop:3.3.6
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash","-lc"]
          args:
            - |
              if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then
                hdfs namenode -format -force -nonInteractive
              fi
              exec hdfs namenode
          ports:
            - containerPort: 9000
            - containerPort: 9870
          volumeMounts:
            - name: hdfs-config
              mountPath: /opt/hadoop/etc/hadoop/core-site.xml
              subPath: core-site.xml
            - name: hdfs-config2
              mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml
              subPath: hdfs-site.xml
            - name: namenode-data
              mountPath: /tmp/hadoop-root/dfs/name
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
      volumes:
        - name: hdfs-config
          configMap:
            name: hdfs-config
        - name: hdfs-config2
          configMap:
            name: hdfs-config
  volumeClaimTemplates:
    - metadata:
        name: namenode-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
