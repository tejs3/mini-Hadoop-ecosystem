apiVersion: v1
kind: Service
metadata:
  name: hbase-master
  namespace: hadoop
spec:
  selector:
    app: hbase-master
  ports:
    - name: master
      port: 16000
      targetPort: 16000
    - name: info
      port: 16010
      targetPort: 16010
---
apiVersion: v1
kind: Service
metadata:
  name: hbase-rs
  namespace: hadoop
spec:
  clusterIP: None
  selector:
    app: hbase-rs
  ports:
    - name: regionserver
      port: 16020
    - name: info
      port: 16030
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hbase-master
  namespace: hadoop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hbase-master
  template:
    metadata:
      labels:
        app: hbase-master
    spec:
      enableServiceLinks: false
      containers:
        - name: master
          image: openeuler/hbase:2.6.5-oe2403sp3
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/start-master.sh"]
          ports:
            - containerPort: 16000
            - containerPort: 16010
          env:
            - name: HBASE_MANAGES_ZK
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1"
      volumes:
        - name: config
          configMap:
            name: hbase-config
        - name: scripts
          configMap:
            name: hbase-scripts
            defaultMode: 0755
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hbase-rs
  namespace: hadoop
spec:
  serviceName: hbase-rs
  replicas: 2
  selector:
    matchLabels:
      app: hbase-rs
  template:
    metadata:
      labels:
        app: hbase-rs
    spec:
      enableServiceLinks: false
      containers:
        - name: regionserver
          image: openeuler/hbase:2.6.5-oe2403sp3
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/start-rs.sh"]
          ports:
            - containerPort: 16020
            - containerPort: 16030
          env:
            - name: HBASE_MANAGES_ZK
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1"
      volumes:
        - name: config
          configMap:
            name: hbase-config
        - name: scripts
          configMap:
            name: hbase-scripts
            defaultMode: 0755
