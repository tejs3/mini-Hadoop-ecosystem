apiVersion: v1
kind: ConfigMap
metadata:
  name: solr-config
  namespace: hadoop
data:
  ZK_HOST: "zk-0.zk-hs.hadoop.svc.cluster.local:2181,zk-1.zk-hs.hadoop.svc.cluster.local:2181,zk-2.zk-hs.hadoop.svc.cluster.local:2181"
---
apiVersion: v1
kind: Service
metadata:
  name: solr-hs
  namespace: hadoop
spec:
  clusterIP: None
  selector:
    app: solr
  ports:
    - name: http
      port: 8983
---
apiVersion: v1
kind: Service
metadata:
  name: solr
  namespace: hadoop
spec:
  selector:
    app: solr
  ports:
    - name: http
      port: 8983
      targetPort: 8983
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: solr
  namespace: hadoop
spec:
  serviceName: solr-hs
  replicas: 2
  selector:
    matchLabels:
      app: solr
  template:
    metadata:
      labels:
        app: solr
    spec:
      enableServiceLinks: false
      containers:
        - name: solr
          image: solr:9.8
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/start-solr.sh"]
          ports:
            - containerPort: 8983
              name: http
          env:
            - name: ZK_HOST
              valueFrom:
                configMapKeyRef:
                  name: solr-config
                  key: ZK_HOST
            - name: SOLR_JAVA_MEM
              value: "-Xms512m -Xmx1024m"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: /var/solr
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1536Mi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /solr/admin/info/system
              port: 8983
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
      volumes:
        - name: scripts
          configMap:
            name: solr-scripts
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
