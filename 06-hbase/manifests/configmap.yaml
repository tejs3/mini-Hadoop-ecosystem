apiVersion: v1
data:
  core-site.xml: |
    <?xml version="1.0"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
      <property>
        <name>fs.defaultFS</name>
        <value>hdfs://namenode:9000</value>
      </property>
      <property>
        <name>hadoop.tmp.dir</name>
        <value>/tmp/hadoop-${user.name}</value>
      </property>
    </configuration>
  hbase-site.xml: |
    <?xml version="1.0"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
      <property>
        <name>hbase.rootdir</name>
        <value>hdfs://namenode:9000/hbase</value>
      </property>
      <property>
        <name>hbase.cluster.distributed</name>
        <value>true</value>
      </property>
      <property>
        <name>hbase.zookeeper.quorum</name>
        <value>zk-0.zk-hs.hadoop.svc.cluster.local,zk-1.zk-hs.hadoop.svc.cluster.local,zk-2.zk-hs.hadoop.svc.cluster.local</value>
      </property>
      <property>
        <name>hbase.zookeeper.property.clientPort</name>
        <value>2181</value>
      </property>
      <property>
        <name>hbase.master.port</name>
        <value>16000</value>
      </property>
      <property>
        <name>hbase.master.info.bindAddress</name>
        <value>0.0.0.0</value>
      </property>
      <property>
        <name>hbase.master.info.port</name>
        <value>16010</value>
      </property>
      <property>
        <name>hbase.regionserver.port</name>
        <value>16020</value>
      </property>
      <property>
        <name>hbase.regionserver.info.bindAddress</name>
        <value>0.0.0.0</value>
      </property>
      <property>
        <name>hbase.regionserver.info.port</name>
        <value>16030</value>
      </property>
      <property>
        <name>hbase.unsafe.stream.capability.enforce</name>
        <value>false</value>
      </property>
    </configuration>
  hdfs-site.xml: |
    <?xml version="1.0"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
      <!-- Part1: 2 DataNodes => RF=2. Part2: scale to 3 DNs then set RF=3 -->
      <property>
        <name>dfs.replication</name>
        <value>2</value>
      </property>
      <property>
        <name>dfs.namenode.name.dir</name>
        <value>file:///tmp/hadoop-root/dfs/name</value>
      </property>
      <property>
        <name>dfs.datanode.data.dir</name>
        <value>file:///tmp/hadoop-root/dfs/data</value>
      </property>
      <property>
        <name>dfs.namenode.rpc-address</name>
        <value>namenode:9000</value>
      </property>
      <property>
        <name>dfs.namenode.rpc-bind-host</name>
        <value>0.0.0.0</value>
      </property>
      <property>
        <name>dfs.namenode.http-address</name>
        <value>0.0.0.0:9870</value>
      </property>
      <property>
        <name>dfs.namenode.datanode.registration.ip-hostname-check</name>
        <value>false</value>
      </property>
      <property>
        <name>dfs.permissions.enabled</name>
        <value>false</value>
      </property>
      <property>
        <name>dfs.blocksize</name>
        <value>134217728</value>
      </property>
    </configuration>
kind: ConfigMap
metadata:
  name: hbase-config
  namespace: hadoop
