tickTime=2000
initLimit=10
syncLimit=5
dataDir=/data
dataLogDir=/datalog
clientPort=2181
maxClientCnxns=60
autopurge.snapRetainCount=3
autopurge.purgeInterval=1
# 3-node ensemble (zk-0, zk-1, zk-2)
server.1=zk-0.zk.hadoop.svc.cluster.local:2888:3888
server.2=zk-1.zk.hadoop.svc.cluster.local:2888:3888
server.3=zk-2.zk.hadoop.svc.cluster.local:2888:3888
4lw.commands.whitelist=*
admin.enableServer=true
admin.serverPort=8080
