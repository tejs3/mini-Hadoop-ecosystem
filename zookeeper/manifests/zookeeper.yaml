apiVersion: v1
kind: Service
metadata:
  name: zk-hs
  namespace: hadoop
  labels:
    app: zk
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: zk
  ports:
    - name: client
      port: 2181
    - name: server
      port: 2888
    - name: leader-election
      port: 3888
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: hadoop
  labels:
    app: zk
spec:
  selector:
    app: zk
  ports:
    - name: client
      port: 2181
      targetPort: 2181
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zk
  namespace: hadoop
spec:
  serviceName: zk-hs
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: zk
  template:
    metadata:
      labels:
        app: zk
    spec:
      containers:
        - name: zookeeper
          image: zookeeper:3.9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2181
              name: client
            - containerPort: 2888
              name: server
            - containerPort: 3888
              name: leader-election
          env:
            - name: ZOO_STANDALONE_ENABLED
              value: "false"
            - name: ZOO_4LW_COMMANDS_WHITELIST
              value: "*"
          command:
            - bash
            - -lc
            - |
              set -e
              ORDINAL=${HOSTNAME##*-}
              echo $((ORDINAL + 1)) > /data/myid
              cp /config/zoo.cfg /conf/zoo.cfg
              echo "myid=$(cat /data/myid)"
              cat /conf/zoo.cfg
              exec zkServer.sh start-foreground
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: datalog
              mountPath: /datalog
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["bash","-lc","echo ruok | nc 127.0.0.1 2181 | grep imok"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: zk-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: datalog
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
