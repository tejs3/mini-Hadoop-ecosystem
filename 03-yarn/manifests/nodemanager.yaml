apiVersion: v1
kind: Service
metadata:
  name: nodemanager
  namespace: hadoop
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: nodemanager
  ports:
    - name: web
      port: 8042
    - name: shuffle
      port: 13562
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nodemanager
  namespace: hadoop
spec:
  serviceName: nodemanager
  replicas: 2
  selector:
    matchLabels:
      app: nodemanager
  template:
    metadata:
      labels:
        app: nodemanager
    spec:
      enableServiceLinks: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: nodemanager
      containers:
        - name: nodemanager
          image: apache/hadoop:3.3.6
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/start-nm.sh"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 8042
            - containerPort: 13562
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "3Gi"
              cpu: "2"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: config
          configMap:
            name: yarn-config
        - name: scripts
          configMap:
            name: yarn-nm-scripts
            defaultMode: 0755
